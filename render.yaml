# Render Blueprint: New > Blueprint > pick this repo. Creates a free Postgres database and one web
# service (API + frontend in one container). Demo accounts are seeded on first boot.
services:
  - type: web
    name: british-auction-rfq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: british-auction-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"

databases:
  - name: british-auction-db
    plan: free
