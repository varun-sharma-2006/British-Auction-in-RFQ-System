# Load balancer + static file server for the docker-compose topology.

# Docker's embedded DNS. `resolve` below re-queries it, so replicas that are added, removed or
# restarted (new IPs) join or leave the pool without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_pool {
    zone api_pool 64k;
    # least_conn rather than round-robin: WebSockets are long-lived, so "fewest open connections"
    # spreads load better than "next in line".
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upgrade only real WebSocket requests; keep-alive for everything else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Which replica answered, for demos and debugging (the API also sets X-Served-By).
    add_header X-Upstream $upstream_addr always;

    location /api/ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A replica that fails or times out is retried on another for idempotent requests only.
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /ws {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        # No sticky sessions needed: whichever replica holds the socket receives every update via Redis.
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
