# Full "scaled" topology:
#   nginx (static UI + load balancer)  ->  3 x FastAPI replicas  ->  PostgreSQL
#                                              |  Redis (pub/sub fan-out, Bloom filters, Celery broker)
#                                     Celery beat + worker (auction closer)
#
#   docker compose up --build
#   docker compose run --rm migrate python -m scripts.seed      # demo data + demo logins
# Web UI: http://localhost:8080      Scale API replicas: docker compose up --scale api=5

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/british_auction
    REDIS_URL: redis://redis:6379/0
    RUN_CLOSER: "false"            # Celery beat + worker run the closer instead of the API
    JWT_SECRET: change-me-in-production-use-a-long-random-string
    CORS_ORIGINS: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: british_auction
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d british_auction"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Runs once, before any API replica starts, so replicas never race each other on migrations.
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    deploy:
      replicas: 3                  # stateless: JWT auth, row locks in Postgres, live updates via Redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  worker:
    <<: *backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  # nginx: serves the built React app and load-balances /api and /ws across the API replicas.
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
