# Full "scaled" topology: PostgreSQL + Redis + API + Celery worker + Celery beat + web.
#   docker compose up --build
#   docker compose exec api python -m scripts.seed      # demo data + demo logins
# Web UI: http://localhost:8080   API docs: http://localhost:8000/docs

x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/british_auction
    REDIS_URL: redis://redis:6379/0
    RUN_CLOSER: "false"            # Celery beat + worker run the closer instead of the API
    JWT_SECRET: change-me-in-production-use-a-long-random-string
    CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: british_auction
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d british_auction"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    <<: *backend
    ports: ["8000:8000"]
    # Applies migrations, then serves the API (several replicas are fine: Redis fans out live updates).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    <<: *backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: celery -A app.worker beat --loglevel=info

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
