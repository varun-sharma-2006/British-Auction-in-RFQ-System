name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, migrations, tests on PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: british_auction
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/british_auction
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/british_auction_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply, match the models, and roll back cleanly
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE british_auction_test"
      - name: Tests (incl. row-lock concurrency tests) with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Seed script runs against a migrated database
        run: python -m scripts.seed && python -m scripts.seed --if-empty

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, single-container mode)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: british_auction
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/british_auction
      FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            e2e/requirements.txt
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Start app (API + SPA on :8000) with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt -r ../e2e/requirements.txt
          alembic upgrade head
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - run: python -m playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: E2E_BASE_URL=http://localhost:8000 pytest e2e -v
      - name: Server log
        if: always()
        run: cat uvicorn.log
